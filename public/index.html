<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clozeit</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0f14;
        --panel: #121820;
        --line: #26313d;
        --text: #eef2f6;
        --muted: #9aa7b4;
        --accent: #7dd3fc;
        --accent-soft: rgba(125, 211, 252, 0.12);
        --highlight-yellow: rgba(244, 211, 94, 0.38);
        --highlight-green: rgba(136, 209, 138, 0.34);
        --highlight-blue: rgba(121, 184, 255, 0.34);
        --highlight-pink: rgba(244, 160, 200, 0.34);
        --danger: #fb7185;
        --danger-soft: rgba(251, 113, 133, 0.12);
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        display: grid;
        grid-template-columns: minmax(190px, 260px) minmax(0, 1fr);
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      button {
        border: 1px solid var(--line);
        border-radius: 6px;
        min-height: 34px;
        padding: 6px 10px;
        background: #151c25;
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }

      button:hover,
      button.active {
        border-color: var(--accent);
        background: var(--accent-soft);
        color: var(--accent);
      }

      .sidebar {
        min-height: 0;
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--line);
        background: var(--panel);
      }

      .sidebar-header,
      .topbar {
        min-height: 58px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
      }

      h1 { margin: 0; font-size: 18px; }

      .folders {
        min-height: 0;
        overflow: auto;
        padding: 10px;
      }

      .folder { margin-bottom: 12px; }

      .folder-name {
        margin: 2px 0 6px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }

      .note-row {
        width: 100%;
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 5px;
        text-align: left;
      }

      .count { color: var(--muted); }

      .workspace {
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      .note-title {
        min-width: 0;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 18px;
        font-weight: 700;
      }

      .study-view {
        min-height: 0;
        flex: 1;
        overflow: auto;
        padding: 28px;
        background: var(--bg);
        color: var(--text);
        font-size: 19px;
        line-height: 1.8;
        white-space: pre-wrap;
        tab-size: 4;
        user-select: none;
        -webkit-user-select: none;
      }

      .token {
        border-radius: 2px;
        display: inline;
        line-height: inherit;
        padding: 0;
        color: inherit;
      }

      .token.covered,
      .token.hidden.revealed { cursor: pointer; }

      .token.covered {
        background: transparent;
        color: transparent;
        box-shadow: inset 0 -1px 0 rgba(237, 241, 244, 0.55);
      }
.token.hidden.revealed { user-select: none; }
      #wrong-only.active {
        border-color: var(--danger);
        background: var(--danger-soft);
        color: var(--danger);
      }

      .token.wrong {
        text-decoration-line: underline;
        text-decoration-style: dotted;
        text-decoration-color: var(--danger);
        text-decoration-thickness: 2px;
        text-underline-offset: 0.32em;
      }
      .token.highlight-yellow:not(.covered),
      .token.highlight-green:not(.covered),
      .token.highlight-blue:not(.covered),
      .token.highlight-pink:not(.covered) {
        -webkit-box-decoration-break: clone;
        box-decoration-break: clone;
      }
      .token.highlight-yellow:not(.covered) { background: linear-gradient(to top, var(--highlight-yellow) 0 58%, transparent 58%); }
      .token.highlight-green:not(.covered) { background: linear-gradient(to top, var(--highlight-green) 0 58%, transparent 58%); }
      .token.highlight-blue:not(.covered) { background: linear-gradient(to top, var(--highlight-blue) 0 58%, transparent 58%); }
      .token.highlight-pink:not(.covered) { background: linear-gradient(to top, var(--highlight-pink) 0 58%, transparent 58%); }

      .empty,
      .status { color: var(--muted); }

      .nav-toggle,
      .drawer-overlay { display: none; }

      @media (max-width: 720px) {
        body {
          grid-template-columns: 1fr;
          grid-template-rows: minmax(0, 1fr);
        }

        .sidebar {
          position: fixed;
          top: 0;
          bottom: 0;
          left: 0;
          z-index: 20;
          width: min(84vw, 320px);
          transform: translateX(-100%);
          transition: transform 160ms ease;
          border-right: 1px solid var(--line);
          box-shadow: 16px 0 40px rgba(0, 0, 0, 0.35);
        }

        body.nav-open .sidebar { transform: translateX(0); }

        .drawer-overlay {
          position: fixed;
          inset: 0;
          z-index: 10;
          display: block;
          background: rgba(0, 0, 0, 0.48);
        }

        .drawer-overlay[hidden] { display: none; }
        .workspace { min-height: 100vh; }
        .topbar { min-height: 54px; padding: 10px; }

        .nav-toggle {
          display: inline-flex;
          flex: 0 0 auto;
          align-items: center;
          justify-content: center;
        }

        .note-title { font-size: 16px; }
        #hide-revealed,
        #wrong-only { flex: 0 0 auto; }
        .study-view { padding: 18px; font-size: 17px; }
      }
    </style>
  </head>
  <body>
    <aside class="sidebar" aria-label="Notes navigation">
      <header class="sidebar-header"><h1>Clozeit</h1></header>
      <div id="folders" class="folders"></div>
    </aside>
    <div id="drawer-overlay" class="drawer-overlay" hidden></div>

    <main class="workspace">
      <header class="topbar">
        <button id="nav-toggle" class="nav-toggle" type="button" aria-expanded="false" aria-controls="folders">Notes</button>
        <div id="note-title" class="note-title">Clozeit</div>
        <button id="hide-revealed" type="button">Hide revealed</button>
        <button id="wrong-only" type="button" aria-pressed="false">Wrong only</button>
      </header>
      <article id="study-view" class="study-view" tabindex="0" aria-label="Study note"><p class="status">Loading...</p></article>
    </main>

    <script>
      (function () {
        const DATA_URL = 'data.json';
        const foldersEl = document.getElementById('folders');
        const titleEl = document.getElementById('note-title');
        const studyView = document.getElementById('study-view');
        const hideRevealedBtn = document.getElementById('hide-revealed');
        const wrongOnlyBtn = document.getElementById('wrong-only');
        const navToggleBtn = document.getElementById('nav-toggle');
        const drawerOverlay = document.getElementById('drawer-overlay');
        let sourceState = null;
        let state = null;
        let lastPointerType = 'mouse';
        let longPressTimer = null;
        let longPressHandled = false;

        function clone(value) { return JSON.parse(JSON.stringify(value)); }

        function storageKey() {
          return 'clozeit-public-study-progress-v2';
        }

        function legacyStorageKey() {
          const id = sourceState && (sourceState.shareId || sourceState.publishedAt || 'current');
          return 'clozeit-public-study-state-' + id;
        }

        function readSavedProgress() {
          const keys = [storageKey(), legacyStorageKey()];
          for (const key of keys) {
            try {
              const saved = JSON.parse(localStorage.getItem(key));
              if (saved && Array.isArray(saved.folders)) return saved;
            } catch (error) {}
          }
          return null;
        }

        function tokenProgressMap(savedState) {
          const progress = new Map();
          (savedState.folders || []).forEach(function (folder) {
            (folder.notes || []).forEach(function (note) {
              const tokenMap = new Map();
              (note.tokens || []).forEach(function (token) {
                if (!token || !token.id) return;
                tokenMap.set(token.id, {
                  wrong: Boolean(token.wrong),
                  hinted: Boolean(token.hinted),
                  revealed: Boolean(token.revealed)
                });
              });
              progress.set(note.id, tokenMap);
            });
          });
          return progress;
        }

        function applySavedProgress(nextState, savedState) {
          const progress = tokenProgressMap(savedState);
          nextState.reviewWrongOnly = Boolean(savedState.reviewWrongOnly);
          if (nextState.folders.some(function (folder) { return folder.id === savedState.currentFolderId; })) {
            nextState.currentFolderId = savedState.currentFolderId;
          }
          nextState.folders.forEach(function (folder) {
            folder.notes.forEach(function (note) {
              const tokenMap = progress.get(note.id);
              if (!tokenMap) return;
              note.tokens.forEach(function (token) {
                const savedToken = tokenMap.get(token.id);
                if (!savedToken || !token.hidden) return;
                token.wrong = savedToken.wrong;
                token.hinted = savedToken.hinted;
                token.revealed = savedToken.revealed;
              });
            });
          });
          const currentFolder = nextState.folders.find(function (folder) { return folder.id === nextState.currentFolderId; });
          if (currentFolder && currentFolder.notes.some(function (note) { return note.id === savedState.currentNoteId; })) {
            nextState.currentNoteId = savedState.currentNoteId;
          }
        }

        function loadLocalState() {
          const nextState = clone(sourceState);
          nextState.reviewWrongOnly = false;
          const saved = readSavedProgress();
          if (saved) applySavedProgress(nextState, saved);
          return nextState;
        }

        function saveState() {
          try { localStorage.setItem(storageKey(), JSON.stringify(state)); } catch (error) {}
        }

        function isMobileLayout() { return window.matchMedia('(max-width: 720px)').matches; }

        function setDrawerOpen(open) {
          const nextOpen = Boolean(open) && isMobileLayout();
          document.body.classList.toggle('nav-open', nextOpen);
          drawerOverlay.hidden = !nextOpen;
          navToggleBtn.setAttribute('aria-expanded', String(nextOpen));
        }

        function currentFolder() {
          return state.folders.find(function (folder) { return folder.id === state.currentFolderId; }) || state.folders[0];
        }

        function currentNote() {
          const folder = currentFolder();
          if (!folder) return null;
          return folder.notes.find(function (note) { return note.id === state.currentNoteId; }) || folder.notes[0] || null;
        }

        function hiddenCount(note) {
          const count = note.tokens.filter(function (token) { return token.hidden; }).length;
          return count ? String(count) : '';
        }

        function tokenClass(token) {
          const classes = ['token', token.isSpace ? 'space' : 'word'];
          const reviewHidden = shouldReviewHiddenToken(token);
          if (token.hidden) classes.push('hidden');
          if (token.wrong) classes.push('wrong');
          if (reviewHidden && !token.revealed) classes.push('covered');
          if (token.revealed || (token.hidden && !reviewHidden)) classes.push('revealed');
          if (token.highlight) classes.push('highlight-' + token.highlight);
          return classes.join(' ');
        }

        function shouldReviewHiddenToken(token) {
          return Boolean(token.hidden && (!state.reviewWrongOnly || token.wrong));
        }

        function setHiddenTokenView(note, token, viewState) {
          const nextRevealed = viewState === 'revealed';
          const applyState = function (candidate) {
            if (!candidate.hidden) return;
            candidate.hinted = false;
            candidate.revealed = nextRevealed;
          };

          if (token.hiddenGroup) {
            note.tokens.forEach(function (candidate) {
              if (candidate.hiddenGroup === token.hiddenGroup) applyState(candidate);
            });
            return;
          }
          applyState(token);
        }

        function setWrongTokenState(note, token, wrongState) {
          const applyState = function (candidate) {
            if (!candidate.hidden) return;
            candidate.wrong = Boolean(wrongState);
            if (!candidate.wrong && state.reviewWrongOnly) {
              candidate.hinted = false;
              candidate.revealed = false;
            }
          };

          if (token.hiddenGroup) {
            note.tokens.forEach(function (candidate) {
              if (candidate.hiddenGroup === token.hiddenGroup) applyState(candidate);
            });
            return;
          }
          applyState(token);
        }

        function toggleWrongToken(note, token) {
          setWrongTokenState(note, token, !token.wrong);
          render();
        }

        function nextHiddenClickState(token) {
          return token.revealed ? 'covered' : 'revealed';
        }
function renderNavigation() {
          foldersEl.replaceChildren();
          state.folders.forEach(function (folder) {
            const section = document.createElement('section');
            section.className = 'folder';

            const name = document.createElement('div');
            name.className = 'folder-name';
            name.textContent = folder.name || 'Folder';
            section.appendChild(name);

            folder.notes.forEach(function (note) {
              const button = document.createElement('button');
              button.type = 'button';
              button.className = 'note-row' + (note.id === state.currentNoteId ? ' active' : '');
              button.dataset.folderId = folder.id;
              button.dataset.noteId = note.id;

              const label = document.createElement('span');
              label.textContent = note.title || 'Untitled';
              button.appendChild(label);

              const count = document.createElement('span');
              count.className = 'count';
              count.textContent = hiddenCount(note);
              button.appendChild(count);

              section.appendChild(button);
            });
            foldersEl.appendChild(section);
          });
        }

        function renderNote() {
          const note = currentNote();
          studyView.replaceChildren();
          titleEl.textContent = note ? note.title || 'Untitled' : 'Untitled';

          if (!note || !note.text.trim()) {
            const empty = document.createElement('p');
            empty.className = 'empty';
            empty.textContent = 'No text in this note';
            studyView.appendChild(empty);
            return;
          }

          note.tokens.forEach(function (token) {
            if (token.isSpace && !token.highlight) {
              studyView.appendChild(document.createTextNode(token.value));
              return;
            }
            const span = document.createElement('span');
            span.className = tokenClass(token);
            span.dataset.tokenId = token.id;
            span.textContent = token.value;
            studyView.appendChild(span);
          });
        }

        function render() {
          renderNavigation();
          renderNote();
          wrongOnlyBtn.classList.toggle('active', Boolean(state.reviewWrongOnly));
          wrongOnlyBtn.setAttribute('aria-pressed', String(Boolean(state.reviewWrongOnly)));
          saveState();
        }

        function showError(message) {
          titleEl.textContent = 'Clozeit';
          studyView.replaceChildren();
          const status = document.createElement('p');
          status.className = 'status';
          status.textContent = message;
          studyView.appendChild(status);
        }

        foldersEl.addEventListener('click', function (event) {
          const button = event.target.closest('[data-note-id]');
          if (!button) return;
          state.currentFolderId = button.dataset.folderId;
          state.currentNoteId = button.dataset.noteId;
          render();
          setDrawerOpen(false);
        });

        navToggleBtn.addEventListener('click', function () {
          setDrawerOpen(!document.body.classList.contains('nav-open'));
        });

        drawerOverlay.addEventListener('click', function () { setDrawerOpen(false); });
        window.addEventListener('resize', function () { if (!isMobileLayout()) setDrawerOpen(false); });
        document.addEventListener('keydown', function (event) { if (event.key === 'Escape') setDrawerOpen(false); });

        studyView.addEventListener('click', function (event) {
          const tokenEl = event.target.closest('.token.hidden');
          if (!tokenEl || !state) return;
          const note = currentNote();
          const token = note.tokens.find(function (candidate) { return candidate.id === tokenEl.dataset.tokenId; });
          if (!token) return;
          if (longPressHandled) {
            longPressHandled = false;
            return;
          }
          if (event.shiftKey) {
            event.preventDefault();
            toggleWrongToken(note, token);
            return;
          }
          if (!shouldReviewHiddenToken(token)) return;
          setHiddenTokenView(note, token, nextHiddenClickState(token));
          render();
        });

        studyView.addEventListener('pointerdown', function (event) {
          lastPointerType = event.pointerType || 'mouse';
          if (event.pointerType === 'mouse' || !state) return;
          const tokenEl = event.target.closest('.token.hidden');
          if (!tokenEl) return;
          const note = currentNote();
          const token = note.tokens.find(function (candidate) { return candidate.id === tokenEl.dataset.tokenId; });
          if (!token) return;
          clearTimeout(longPressTimer);
          longPressHandled = false;
          longPressTimer = setTimeout(function () {
            if (token.revealed) {
              setWrongTokenState(note, token, !token.wrong);
            } else {
              setHiddenTokenView(note, token, 'revealed');
            }
            longPressHandled = true;
            render();
          }, 520);
        });

        ['pointerup', 'pointercancel'].forEach(function (eventName) {
          studyView.addEventListener(eventName, function () { clearTimeout(longPressTimer); });
        });


        studyView.addEventListener('contextmenu', function (event) {
          const tokenEl = event.target.closest('.token.hidden');
          event.preventDefault();
          if (!tokenEl || !state) return;
          if (lastPointerType !== 'mouse' || longPressHandled) return;
          const note = currentNote();
          const token = note.tokens.find(function (candidate) { return candidate.id === tokenEl.dataset.tokenId; });
          if (!token) return;
          toggleWrongToken(note, token);
        });

        hideRevealedBtn.addEventListener('click', function () {
          if (!state) return;
          const note = currentNote();
          if (!note) return;
          note.tokens.forEach(function (token) {
            if (token.hidden) {
              token.hinted = false;
              token.revealed = false;
            }
          });
          render();
        });

        wrongOnlyBtn.addEventListener('click', function () {
          if (!state) return;
          state.reviewWrongOnly = !state.reviewWrongOnly;
          const note = currentNote();
          if (state.reviewWrongOnly && note) {
            note.tokens.forEach(function (token) {
              if (token.hidden && token.wrong) {
                token.hinted = false;
                token.revealed = false;
              }
            });
          }
          render();
        });

        ['copy', 'cut', 'dragstart', 'selectstart'].forEach(function (eventName) {
          studyView.addEventListener(eventName, function (event) { event.preventDefault(); });
        });

        fetch(DATA_URL, { cache: 'no-store' })
          .then(function (response) {
            if (!response.ok) throw new Error('Missing data.json');
            return response.json();
          })
          .then(function (data) {
            sourceState = data;
            state = loadLocalState();
            if (!Array.isArray(state.folders) || !state.folders.length) throw new Error('Invalid data.json');
            render();
          })
          .catch(function () {
            showError('No published Clozeit data yet. Publish data.json from the editor.');
          });
      })();
    </script>
  </body>
</html>
